<script>
const $ = id => document.getElementById(id);
let db = {members:[], keys:[], history:[]};
const API_KEY = 'smartKeyBoxApiUrl';
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbw9gc0W6nxjFt9wKYl9JCBLiNotoiSWL0ObARfMhnyzsXe_Z0P_9bAUahAYqZWmwnAVjA/exec';
$('apiUrl').value = localStorage.getItem(API_KEY) || DEFAULT_API_URL;

function setStatus(message, state='wait'){
  $('statusText').textContent=message;
  $('statusDot').className='dot'+(state==='ok'?' ok':state==='bad'?' bad':'');
}
function showError(message){$('notice').textContent=message;$('notice').classList.add('show')}
function clearError(){$('notice').textContent='';$('notice').classList.remove('show')}
function asArray(value){
  if(Array.isArray(value)) return value;
  if(value && typeof value==='object') return Object.values(value);
  return [];
}
function pick(obj, names){
  if(!obj || typeof obj!=='object') return '';
  for(const n of names){ if(obj[n]!==undefined && obj[n]!==null) return obj[n]; }
  const keys=Object.keys(obj);
  for(const n of names){const found=keys.find(k=>k.toLowerCase()===n.toLowerCase());if(found)return obj[found];}
  return '';
}
function normalizePayload(data){
  let root=data;
  for(let i=0;i<3 && root && !hasCollections(root);i++){
    root=root.data || root.result || root.records || root;
    if(root===data) break;
  }
  function find(names){
    for(const name of names){
      const k=Object.keys(root||{}).find(x=>x.toLowerCase()===name.toLowerCase());
      if(k!==undefined) return asArray(root[k]);
    }
    return [];
  }
  return {members:find(['members','member']),keys:find(['keys','key']),history:find(['history','histories','logs'])};
}
function hasCollections(o){return !!o && typeof o==='object' && Object.keys(o).some(k=>['members','member','keys','key','history','histories','logs'].includes(k.toLowerCase()));}
function statusClass(value){
  const s=String(value??'').toLowerCase();
  if(/available|ว่าง|พร้อม|คืนแล้ว|active|ใช้งาน/.test(s)) return 'good';
  if(/borrow|ยืม|ไม่ว่าง|inactive|ปิด/.test(s)) return 'warn';
  if(/lost|เสีย|error|blocked/.test(s)) return 'bad';
  return '';
}
function pill(value){const v=value===''?'ไม่ระบุ':String(value);return `<span class="pill ${statusClass(v)}">${escapeHtml(v)}</span>`}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cell(v){return escapeHtml(v===''?'—':v)}
function render(){
  $('memberCount').textContent=db.members.length;
  $('keyCount').textContent=db.keys.length;
  const available=db.keys.filter(k=>/available|ว่าง|พร้อม|คืนแล้ว/i.test(String(pick(k,['Status','สถานะ'])))).length;
  $('availableCount').textContent=available;
  $('historyCount').textContent=db.history.length;
  $('keySummary').textContent=`พร้อมใช้งาน ${available} / ${db.keys.length} ช่อง`;
  const grid=$('keyGrid');
  grid.innerHTML=db.keys.length?db.keys.map((k,i)=>{
    const id=pick(k,['KeyID','keyId','รหัสกุญแจ'])||`KEY-${i+1}`;
    const name=pick(k,['KeyName','name','ชื่อกุญแจ'])||id;
    const st=pick(k,['Status','status','สถานะ'])||'ไม่ระบุ';
    const holder=pick(k,['BorrowerName','borrowerName','ชื่อผู้ยืม']);
    return `<div class="key"><div class="symbol">🗝️</div><strong>${cell(name)}</strong><small>${cell(id)}</small><div style="margin-top:10px">${pill(st)}</div>${holder?`<small style="display:block;margin-top:8px">ผู้ถือ: ${cell(holder)}</small>`:''}</div>`;
  }).join(''):'<div class="empty">ไม่พบข้อมูลกุญแจใน API</div>';
  renderMembers();renderKeys();renderHistory();
}
function renderMembers(){
 const q=$('memberSearch').value.toLowerCase();
 const rows=db.members.filter(m=>JSON.stringify(m).toLowerCase().includes(q));
 $('membersBody').innerHTML=rows.length?rows.map(m=>`<tr><td>${cell(pick(m,['MemberID','memberId']))}</td><td>${cell(pick(m,['Name','name']))}</td><td>${cell(pick(m,['FingerID','fingerId']))}</td><td>${cell(pick(m,['Role','role']))}</td><td>${pill(pick(m,['Status','status']))}</td><td>${cell(pick(m,['Phone','phone']))}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ไม่พบข้อมูลสมาชิก</td></tr>';
}
function renderKeys(){
 const q=$('keySearch').value.toLowerCase();
 const rows=db.keys.filter(k=>JSON.stringify(k).toLowerCase().includes(q));
 $('keysBody').innerHTML=rows.length?rows.map(k=>`<tr><td>${cell(pick(k,['KeyID','keyId']))}</td><td>${cell(pick(k,['KeyName','keyName']))}</td><td>${pill(pick(k,['Status','status']))}</td><td>${cell(pick(k,['BorrowerID','borrowerId']))}</td><td>${cell(pick(k,['BorrowerName','borrowerName']))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ไม่พบข้อมูลกุญแจ</td></tr>';
}
function renderHistory(){
 const q=$('historySearch').value.toLowerCase();
 const rows=[...db.history].reverse().filter(h=>JSON.stringify(h).toLowerCase().includes(q));
 $('historyBody').innerHTML=rows.length?rows.map(h=>`<tr><td>${cell(pick(h,['Timestamp','timestamp','เวลา']))}</td><td>${cell(pick(h,['MemberID','memberId']))}</td><td>${cell(pick(h,['Name','name']))}</td><td>${cell(pick(h,['KeyID','keyId']))}</td><td>${pill(pick(h,['Action','action','กิจกรรม']))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีประวัติการใช้งาน</td></tr>';
}
async function apiRequest(action){
 const base=$('apiUrl').value.trim();
 if(!base) throw new Error('กรุณาวาง Google Apps Script Web App URL ในส่วนตั้งค่าการเชื่อมต่อก่อน');
 const url=base+(base.includes('?')?'&':'?')+'action='+encodeURIComponent(action);
 const response=await fetch(url,{method:'GET',redirect:'follow'});
 if(!response.ok) throw new Error(`HTTP ${response.status}: ไม่สามารถเรียก API ได้`);
 const text=await response.text();
 let data;try{data=JSON.parse(text)}catch{throw new Error('API ไม่ได้ส่งข้อมูล JSON กลับมา กรุณาตรวจสอบการ Deploy เป็น Web App และสิทธิ์การเข้าถึง')}
 if(data && (data.success===false || data.status==='error')) throw new Error(data.message||data.error||'API แจ้งข้อผิดพลาด');
 return data;
}
async function ping(){
 clearError();setStatus('กำลังตรวจสอบ Google Apps Script...');
 try{
  const data=await apiRequest('ping');
  setStatus(data.message||data.status||'เชื่อมต่อ API สำเร็จ','ok');
  return true;
 }catch(e){setStatus('เชื่อมต่อ API ไม่สำเร็จ','bad');showError(e.message);return false;}
}
async function refresh(){
 $('refreshBtn').disabled=true;clearError();setStatus('กำลังโหลดข้อมูลจาก Google Sheets...');
 try{
  const data=await apiRequest('getData');
  db=normalizePayload(data);
  render();setStatus('เชื่อมต่อ Google Sheets สำเร็จ (Real-time Auto Sync)','ok');
  $('lastUpdate').textContent='· อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH');
 }catch(e){setStatus('โหลดข้อมูลไม่สำเร็จ','bad');showError(e.message);}
 finally{$('refreshBtn').disabled=false;}
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
 ['overview','members','keys','history'].forEach(t=>$(t+'Panel').hidden=t!==b.dataset.tab);
}));
$('saveUrl').addEventListener('click',()=>{const v=$('apiUrl').value.trim();if(!v){showError('กรุณาวาง URL ก่อนบันทึก');return;}localStorage.setItem(API_KEY,v);clearError();setStatus('บันทึก URL แล้ว กำลังตรวจสอบ...');ping();});
$('pingBtn').addEventListener('click',ping);
$('refreshBtn').addEventListener('click',refresh);
$('memberSearch').addEventListener('input',renderMembers);
$('keySearch').addEventListener('input',renderKeys);
$('historySearch').addEventListener('input',renderHistory);

if($('apiUrl').value.trim()) {
  refresh();
  // ตั้งเวลาให้ดึงข้อมูลใหม่ทุกๆ 7 วินาทีอัตโนมัติ (Real-time)
  setInterval(refresh, 7000);
}
</script>
